name: Sync Luma events

on:
  schedule:
    # Run daily at 00:17 UTC, outside the high-load period at the start of the hour.
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sync-luma-events
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Sync the production Luma mirror
        shell: bash
        run: |
          set -euo pipefail

          oidc_response="$(
            curl --fail-with-body --silent --show-error \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=stnl-luma-sync"
          )"
          oidc_token="$(jq -er '.value' <<<"${oidc_response}")"
          echo "::add-mask::${oidc_token}"

          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --retry-delay 5 \
            --retry-all-errors \
            --max-time 65 \
            -H "Authorization: Bearer ${oidc_token}" \
            -H "Accept: application/json" \
            https://nl.superteam.fun/api/cron/sync-luma
